name: Validate Profile README

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".markdownlint.json"
      - ".markdown-link-check.json"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "README.md"
      - ".markdownlint.json"
      - ".markdown-link-check.json"
      - ".github/workflows/validate.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Lint README
        run: npx --yes markdownlint-cli2@0.23.2 README.md

  links:
    name: Link check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check README links
        run: npx --yes markdown-link-check@3.15.0 --config .markdown-link-check.json README.md
