name: Validate Profile README

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'docs/**'
      - 'assets/**'
      - '.github/scripts/**'
      - '.github/workflows/metrics.yml'
      - '.github/workflows/snake.yml'
      - '.markdownlint.json'
      - '.markdown-link-check.json'
      - '.github/workflows/validate.yml'
      - '.github/workflows/prettier.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.gitattributes'
      - '.gitignore'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'assets/**'
      - '.github/scripts/**'
      - '.github/workflows/metrics.yml'
      - '.github/workflows/snake.yml'
      - '.markdownlint.json'
      - '.markdown-link-check.json'
      - '.github/workflows/validate.yml'
      - '.github/workflows/prettier.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.gitattributes'
      - '.gitignore'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Validation is read-only; any future Git commit steps inherit this identity.
env:
  GIT_AUTHOR_NAME: Faraz Hussain
  GIT_AUTHOR_EMAIL: farazhussain5000@gmail.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Lint README
        run: npx --yes markdownlint-cli2@0.23.2 README.md "docs/**/*.md"

      - name: Test metric definitions and generation
        run: node --test .github/scripts/*.test.mjs

  links:
    name: Link check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check README links
        run: |
          npx --yes markdown-link-check@3.15.0 --config .markdown-link-check.json README.md
          npx --yes markdown-link-check@3.15.0 --config .markdown-link-check.json docs/metrics-audit.md
          npx --yes markdown-link-check@3.15.0 --config .markdown-link-check.json docs/formatting.md
