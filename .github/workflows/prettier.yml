name: Prettier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      write:
        description: Apply formatting and commit changes on main
        type: boolean
        default: false
        required: false

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: Faraz Hussain
  GIT_AUTHOR_EMAIL: farazhussain5000@gmail.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  check:
    name: Prettier format check
    if: github.event_name != 'workflow_dispatch' || !inputs.write || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

  format:
    name: Apply Prettier formatting
    if: github.event_name == 'workflow_dispatch' && inputs.write && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: profile-generated-assets
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Format repository
        run: npm run format

      - name: Verify formatting
        run: npm run format:check

      - name: Verify profile scripts
        run: npm test

      - name: Commit formatting changes
        run: |
          git add --update
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier formatting"
            git push origin HEAD:main
          fi
